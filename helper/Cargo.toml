[package]
name = "refantazio-enhanced-helper"
version = "0.2.1"
edition = "2024"
publish = false

[features]
bundled = []

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
png = "0.18"
rfd = "=0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "=3.0.11"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0

[[bin]]
name = "ReFantazio-Enhanced-Helper"
path = "src/main.rs"
